[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hollowmesh"
version = "0.1.0"
description = "Hollow Mesh: signed-feed gossip mesh for the Hollow, plus Countertally"
requires-python = ">=3.11"

# Core protocol (P1-P5): ed25519 signing + payload schemas. Nothing else at runtime.
dependencies = [
    "pynacl>=1.5",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# P11: HTTP transport + nodeapp (real-laptop segment)
http = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]
# H6: the sim's live view (FastAPI + WebSocket; uvicorn[standard] brings websockets)
sim = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hollowmesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # tests import `hollowmesh` even without the editable install
markers = ["chaos: slow randomized partition/crash schedules (P10)"]
addopts = "-m 'not chaos'"

[tool.ruff]
line-length = 100
target-version = "py311"
