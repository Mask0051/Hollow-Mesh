[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "countertally"
version = "0.1.0"
description = "Hollow Mesh: signed-feed gossip mesh for the Hollow, plus Countertally"
requires-python = ">=3.11"
dependencies = [
    "pynacl>=1.5",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# M9: HTTP transport + nodeapp
http = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
# B5: live WebSocket stream for the dashboard
sim = ["websockets>=12"]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/countertally"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["chaos: slow randomized partition/crash schedules (M7)"]
addopts = "-m 'not chaos'"

[tool.ruff]
line-length = 100
target-version = "py311"
