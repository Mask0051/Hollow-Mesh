<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="An SOS from the deepest level, as the network fails">
<title>An SOS from the deepest level, as the network fails</title>
<rect width="720" height="380" rx="10" fill="#fcfcfb"/>
